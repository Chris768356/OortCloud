{% extends "base.html" %}

{% block header %}
    <h2>Registrieren</h2>
{% endblock header %}

{% block content %}
<div class="auth-container">
    <form class="auth-form" action="" method="post">
        <div class="form-group">
            <input type="text" name="username" id="username" placeholder="Benutzername" value="{{ form_data.get('username', '') }}" class="form-input" required>
        </div>
        
        <div class="form-group">
            <input type="email" name="email" id="email" placeholder="E-Mail-Adresse" value="{{ form_data.get('email', '') }}" class="form-input" required>
        </div>
        <div class="form-group">
            <input type="email" name="email-check" id="email-check" placeholder="E-Mail-Adresse wiederholen" value="{{ form_data.get('email-check', '') }}" class="form-input" required>
        </div>
        
        <div class="form-group">
            <input type="password" name="password" id="password" placeholder="Passwort" class="form-input" required>
        </div>
        <div class="form-group">
            <input type="password" name="password-check" id="password-check" placeholder="Passwort wiederholen" class="form-input" required>        
        </div>
        
        <div class="form-group checkbox-group">
            <input type="checkbox" id="agb" name="agb" value="agb-accepted" required>
            <label for="agb">Ich habe die <a href="/agb" class="text-link">AGB</a> gelesen und akzeptiert</label>
        </div>
        
        <div class="form-group checkbox-group">
            <input type="checkbox" id="dsgvo" name="dsgvo" value="dsgvo-accepted" required>
            <label for="dsgvo">Ich habe die <a href="/dsgvo" class="text-link">DSGVO</a> gelesen und akzeptiert</label>
        </div>
        
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <button type="submit" class="btn btn-primary btn-full">Account erstellen</button>
    </form>
</div>
{% endblock content %}
