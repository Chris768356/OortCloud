{% extends "base.html" %}

{% block header %}
    <h2>Login</h2>
{% endblock header %}

{% block content %}
<div class="auth-container">
    <form class="auth-form" action="" method="post">
        <div class="form-group">
            <input type="text" name="login" id="login" placeholder="E-Mail Adresse oder Benutzername" class="form-input" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" id="password" placeholder="Passwort" class="form-input" required>
        </div>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <button type="submit" class="btn btn-primary btn-full">Einloggen</button>
    </form>
</div>
{% endblock content %}
